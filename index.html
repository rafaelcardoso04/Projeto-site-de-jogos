<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site de Jogos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 2rem;
        }
        header {
            text-align: center;
            margin-bottom: 3rem;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .subtitulo {
            opacity: 0.9;
        }
        .jogos-container {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
            max-width: 1200px;
        }
        .jogo-card {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 2rem;
            width: 280px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease, background 0.3s ease;
            text-decoration: none;
            color: white;
        }
        .jogo-card:hover {
            transform: translateY(-8px);
            border-color: #93c5fd;
            background: rgba(255,255,255,0.15);
        }
        .jogo-emoji {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .jogo-nome {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .jogo-desc {
            opacity: 0.8;
            font-size: 0.9rem;
        }
        footer {
            margin-top: 3rem;
            opacity: 0.7;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>🎮 Meu Site de Jogos</h1>
        <p class="subtitulo">Projeto desenvolvido com HTML5, CSS3 e JavaScript</p>
    </header>

    <div class="jogos-container">
        <a href="memoria.html" class="jogo-card">
            <div class="jogo-emoji">🧠</div>
            <div class="jogo-nome">Jogo da Memória</div>
            <div class="jogo-desc">Encontre os pares de cartas iguais</div>
        </a>

        <a href="pedra-papel-tesoura.html" class="jogo-card">
            <div class="jogo-emoji">✊✌️🖐️</div>
            <div class="jogo-nome">Pedra, Papel ou Tesoura</div>
            <div class="jogo-desc">Desafie o computador!</div>
        </a>

        <a href="adivinhe-numero.html" class="jogo-card">
            <div class="jogo-emoji">🔢</div>
            <div class="jogo-nome">Adivinhe o Número</div>
            <div class="jogo-desc">Tente descobrir o número secreto</div>
        </a>
    </div>

    <footer>
        © 2026 Rafael Cardoso Flor — Projeto de Estudos
    </footer>
</body>
</html>
