
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            color: white;
        }
        .voltar {
            color: white;
            text-decoration: none;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
        .voltar:hover { opacity: 1; }
        h1 { margin-bottom: 2rem; }
        .tabuleiro {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            gap: 10px;
        }
        .carta {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #1e3a8a;
            transition: transform 0.3s;
        }
        .carta.virada { background: #fbbf24; }
        .carta.igual { background: #34d399; }
        .reiniciar {
            margin-top: 2rem;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            background: #fbbf24;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <a href="index.html" class="voltar">← Voltar</a>
    <h1>🧠 Jogo da Memória</h1>
    <div class="tabuleiro" id="tabuleiro"></div>
    <button class="reiniciar" onclick="reiniciarJogo()">🔄 Reiniciar Jogo</button>

    <script>
        const emojis = ['🍎', '🍌', '🍇', '🍓', '🍒', '🥝', '🍊', '🍋'];
        let cartas = [...emojis, ...emojis];
        let cartaVirada = [];
        let travarJogo = false;

        function embaralhar(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function criarTabuleiro() {
            cartas = embaralhar(cartas);
            const tabuleiro = document.getElementById('tabuleiro');
            tabuleiro.innerHTML = '';
            
            cartas.forEach((emoji, indice) => {
                const carta = document.createElement('div');
                carta.classList.add('carta');
                carta.dataset.emoji = emoji;
                carta.dataset.indice = indice;
                carta.onclick = () => virarCarta(carta);
                tabuleiro.appendChild(carta);
            });
        }

        function virarCarta(carta) {
            if (travarJogo || cartaVirada.includes(carta) || carta.classList.contains('igual')) return;
            
            carta.textContent = carta.dataset.emoji;
            carta.classList.add('virada');
            cartaVirada.push(carta);

            if (cartaVirada.length === 2) {
                travarJogo = true;
                verificarCombinacao();
            }
        }

        function verificarCombinacao() {
            const [carta1, carta2] = cartaVirada;
            if (carta1.dataset.emoji === carta2.dataset.emoji) {
                carta1.classList.add('igual');
                carta2.classList.add('igual');
                cartaVirada = [];
                travarJogo = false;
            } else {
                setTimeout(() => {
                    carta1.textContent = '';
                    carta2.textContent = '';
                    carta1.classList.remove('virada');
                    carta2.classList.remove('virada');
                    cartaVirada = [];
                    travarJogo = false;
                }, 1000);
            }
        }

        function reiniciarJogo() {
            cartaVirada = [];
            travarJogo = false;
            criarTabuleiro();
        }

        criarTabuleiro();
    </script>
</body>
</html>
