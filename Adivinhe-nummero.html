
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivinhe o Número</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            color: white;
        }
        .voltar { color: white; text-decoration: none; margin-bottom: 1rem; opacity: 0.8; }
        .voltar:hover { opacity: 1; }
        h1 { margin-bottom: 2rem; }
        .caixa {
            background: rgba(255,255,255,0.1);
            padding: 2.5rem;
            border-radius: 16px;
            text-align: center;
        }
        input {
            padding: 0.8rem;
            font-size: 1.2rem;
            width: 150px;
            text-align: center;
            border: none;
            border-radius: 8px;
            margin: 1rem;
        }
        button {
            padding: 0.8rem 2rem;
            font-size: 1rem;
            background: #fbbf24;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        #dica { margin-top: 1.5rem; font-size: 1.2rem; }
        .acertou { color: #34d399; font-weight: bold; }
    </style>
</head>
<body>
    <a href="index.html" class="voltar">← Voltar</a>
    <h1>🔢 Adivinhe o Número Secreto</h1>
    
    <div class="caixa">
        <p>Estou pensando em um número entre 1 e 100</p>
        <input type="number" id="palpite" min="1" max="100" placeholder="Seu palpite">
        <br>
        <button onclick="verificar()">Verificar</button>
        <button onclick="reiniciar()" style="background: #93c5fd; margin-left: 0.5rem;">Novo Jogo</button>
        <p id="dica"></p>
        <p id="tentativas">Tentativas: 0</p>
    </div>

    <script>
        let numeroSecreto = Math.floor(Math.random() * 100) + 1;
        let tentativas = 0;

        function verificar() {
            const palpite = parseInt(document.getElementById('palpite').value);
            const dica = document.getElementById('dica');
            tentativas++;

            if (!palpite || palpite < 1 || palpite > 100) {
                dica.textContent = "⚠️ Digite um número entre 1 e 100";
                dica.className = '';
                return;
            }

            if (palpite === numeroSecreto) {
                dica.textContent = `🎉 Parabéns! Você acertou! O número era ${numeroSecreto}`;
                dica.className = 'acertou';
            } else if (palpite < numeroSecreto) {
                dica.textContent = "📈 Mais alto! Tente um número maior";
                dica.className = '';
            } else {
                dica.textContent = "📉 Mais baixo! Tente um número menor";
                dica.className = '';
            }

            document.getElementById('tentativas').textContent = `Tentativas: ${tentativas}`;
            document.getElementById('palpite').value = '';
        }

        function reiniciar() {
            numeroSecreto = Math.floor(Math.random() * 100) + 1;
            tentativas = 0;
            document.getElementById('dica').textContent = '';
            document.getElementById('tentativas').textContent = 'Tentativas: 0';
            document.getElementById('palpite').value = '';
        }
    </script>
</body>
</html>
